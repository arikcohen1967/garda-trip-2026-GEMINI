<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#fafafa" name="theme-color"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="Garda 2026" name="apple-mobile-web-app-title"/>
<meta content="Garda Trip Minimalist Pro" name="application-name"/>
<title>טיול בת מצווה – אגם גארדה וונציה 2026 · Minimalist Pro</title>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-hover: #f4f4f5;
  --text: #18181b;
  --muted: #71717a;
  --line: rgba(0, 0, 0, 0.06);
  --line-dark: rgba(0, 0, 0, 0.12);
  --primary: #18181b;
  --primary-text: #ffffff;
  --accent: #2563eb;
  --green: #16a34a;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.06);
  --radius: 16px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: calc(110px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }

/* Minimalist Header */
.minimal-header {
  padding: calc(24px + env(safe-area-inset-top)) 20px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.minimal-title h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.02em; }
.minimal-title p { font-size: 13px; color: var(--muted); margin: 0; }
.minimal-badge {
  background: var(--surface-hover); border: 1px solid var(--line-dark);
  padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--text);
}

.wrap { padding: 20px; max-width: 600px; margin: auto; }

/* Clean Day Tabs */
.day-tabs {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex: 0 0 auto; padding: 8px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line-dark); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.2s ease;
}
.day-tab.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); box-shadow: var(--shadow); }

/* Day Card & Stops */
.day-card {
  background: var(--surface); border: 1px solid var(--line-dark); border-radius: var(--radius);
  margin-bottom: 20px; padding: 20px; box-shadow: var(--shadow);
  display: none;
}
.day-card.active-day { display: block; }

.day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.day-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.day-date { font-size: 12px; font-weight: 600; color: var(--accent); }

/* Stop Item - Double Clickable */
.stop-card {
  background: var(--surface-hover); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 12px; cursor: pointer; transition: transform 0.1s ease, box-shadow 0.1s ease;
  user-select: none;
}
.stop-card:hover { border-color: var(--line-dark); box-shadow: var(--shadow-hover); }
.stop-card:active { transform: scale(0.99); }

.stop-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.stop-time { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--surface); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }
.stop-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; color: var(--text); }
.stop-desc { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.4; }

.stop-links {
  display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
}
.stop-link {
  font-size: 11px; font-weight: 600; color: var(--accent); background: var(--surface);
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 4px;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed !important; z-index: 1000; left: 16px !important; right: 16px !important; bottom: calc(16px + env(safe-area-inset-from-bottom, 0px)) !important;
  max-width: 440px; margin: 0 auto !important; padding: 6px; min-height: 54px;
  background: rgba(255, 255, 255, 0.9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border: 1px solid var(--line-dark); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--muted); padding: 4px; border-radius: 12px; cursor: pointer;
}
.bottom-nav a b { font-size: 16px; margin-bottom: 2px; }
.bottom-nav a.active, .bottom-nav a:active { color: var(--text); background: var(--surface-hover); }

/* Full Screen Modal for Double Click */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
.modal.open { display: flex; }
.modal-content {
  background: var(--surface); width: 100%; max-width: 500px; border-radius: var(--radius);
  padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid var(--line-dark);
  position: relative; animation: scaleUp 0.2s ease;
}
@keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-close { position: absolute; top: 16px; left: 16px; border: 0; background: var(--surface-hover); width: 32px; height: 32px; border-radius: 50%; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body data-garda-version="V70-MinimalistPro">

<!-- Minimalist Header -->
<header class="minimal-header">
  <div class="minimal-title">
    <h1>אגם גארדה וונציה</h1>
    <p>טיול בת מצווה · 30.09 - 06.10.2026</p>
  </div>
  <div class="minimal-badge">Bio Agriturismo Vojon</div>
</header>

<main class="wrap">
  <!-- Day Selector Tabs -->
  <div class="day-tabs" id="dayTabs">
    <div class="day-tab active" onclick="showDay(0)">יום 1 · 30/09</div>
    <div class="day-tab" onclick="showDay(1)">יום 2 · 01/10</div>
    <div class="day-tab" onclick="showDay(2)">יום 3 · 02/10</div>
    <div class="day-tab" onclick="showDay(3)">יום 4 · 03/10</div>
    <div class="day-tab" onclick="showDay(4)">יום 5 · 04/10</div>
    <div class="day-tab" onclick="showDay(5)">יום 6 · 05/10</div>
    <div class="day-tab" onclick="showDay(6)">יום 7 · 06/10</div>
  </div>

  <!-- Days Container -->
  <div id="days"></div>
</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a class="active" onclick="showDay(0)"><b>📅</b>מסלול</a>
  <a onclick="openTicketsModal()"><b>🎟️</b>כרטיסים</a>
  <a onclick="openEmergencyModal()"><b>🆘</b>חירום</a>
</nav>

<!-- Double Click Detail Modal -->
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetailModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeDetailModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const tripDays = [
  {date:"2026-09-30", label:"רביעי · 30.09.2026", title:"נחיתה והגעה למלון", icon:"✈️", challenge:"לצלם את התמונה המשפחתית הראשונה באיטליה.", stops:[
    {time:"16:00", name:"נחיתה בנמל התעופה وרונה", dest:"Verona Villafranca Airport", note:"איסוף מזוודות ורכב שכור."},
    {time:"18:00", name:"נסיעה למלון", dest:"Bio Agriturismo Vojon, Ponti sul Mincio, Italy", note:"צ׳ק-אין, התארגנות וארוחת ערב רגועה באזור."}
  ]},
  {date:"2026-10-01", label:"חמישי · 01.10.2026", title:"Gardaland – יום פארק מלא", icon:"🎢", challenge:"לבחור יחד את שלושת המתקנים הכי טובים של היום.", stops:[
    {time:"08:30", name:"יציאה מהמלון ל-Gardaland", dest:"Gardaland Resort", note:"לצאת מוקדם ולהגיע בנחת לפני הכניסה."},
    {time:"09:00", name:"חניה וכניסה ל-Gardaland", dest:"Gardaland Parking", note:"לשמור באפליקציה את מיקום הרכב."},
    {time:"13:00", name:"ארוחת צהריים והפסקה", dest:"Gardaland Resort", note:"הפסקה קצרה, מים וטעינת טלפונים."}
  ]},
  {date:"2026-10-02", label:"שישי · 02.10.2026", title:"סובב אגם גארדה + ראפטינג", icon:"🚣", challenge:"לצלם תמונה משפחתית אחת עם האגם ואחת מהראפטינג.", stops:[
    {time:"08:00", name:"יציאה צפונה לאורך החוף המזרחי", dest:"Malcesine, Italy", note:"נסיעה נופית לאורך האגם."},
    {time:"14:30", name:"יציאה לראפטינג ב-Valdadige", dest:"Visit Valdadige, Volargne, Italy", note:"ראפטינג משפחתי על נהר האדיג׳ה."}
  ]},
  {date:"2026-10-03", label:"שבת · 03.10.2026", title:"Movieland + Medieval Times", icon:"🎬", challenge:"לצלם סלפי משפחתי שנראה כמו פוסטר של סרט.", stops:[
    {time:"09:00", name:"יציאה ל-Movieland", dest:"Movieland The Hollywood Park", note:"יום סרטים ואקשן."},
    {time:"20:00", name:"Medieval Times – מופע האבירים", dest:"Medieval Times Lazise", note:"מופע ערב וארוחה."}
  ]},
  {date:"2026-10-04", label:"ראשון · 04.10.2026", title:"ונציה – יום מלא", icon:"🛶", challenge:"למצוא גשר קטן ויפה מחוץ למסלול הראשי.", stops:[
    {time:"07:30", name:"יציאה מוקדמת מהמלון לוונציה", dest:"Venezia Tronchetto Parking", note:"חניית טרונקטו ומעבר למרכז."},
    {time:"10:15", name:"כיכר סן מרקו", dest:"Piazza San Marco, Venezia", note:"סיור בכיכר ובסביבתה."}
  ]},
  {date:"2026-10-05", label:"שני · 05.10.2026", title:"Borghetto sul Mincio + Valeggio", icon:"🏘️", challenge:"לצלם תמונת בת מצווה מיוחדת בין טחנות המים.", stops:[
    {time:"10:00", name:"Borghetto – הכפר והטחנות", dest:"Borghetto sul Mincio, Italy", note:"טיול רגלי בין הנהר והגשרים."},
    {time:"12:30", name:"ארוחת צהריים – Tortellini", dest:"Valeggio sul Mincio, Italy", note:"טעימת הטורטליני המקומי."}
  ]},
  {date:"2026-10-06", label:"שלישי · 06.10.2026", title:"ורונה + הטיסה הביתה", icon:"❤️", challenge:"לבחור יחד את רגע השיא של כל הטיול.", stops:[
    {time:"09:00", name:"צ׳ק-אאוט ויציאה לוורונה", dest:"Parcheggio Cittadella Verona", note:"סיור קצר בוורונה והבית של יוליה."},
    {time:"18:30", name:"החזרת הרכב בשדה התעופה", dest:"Verona Villafranca Airport", note:"טיסה חזרה הביתה."}
  ]}
];

function renderDays() {
  const container = document.getElementById('days');
  container.innerHTML = tripDays.map((day, di) => `
    <section class="day-card" id="day-${di}">
      <div class="day-head">
        <div>
          <span class="day-date">${day.label}</span>
          <h2>${day.icon} ${day.title}</h2>
        </div>
      </div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:12px; background:var(--surface-hover); padding:8px 12px; border-radius:8px;">
        <b>אתגר:</b> ${day.challenge}
      </div>
      <div>
        ${day.stops.map((stop, si) => `
          <div class="stop-card" ondblclick="openDetail('${stop.name}', '${stop.note}', '${stop.dest}')" title="לחץ כפולה לפרטים מלאים">
            <div class="stop-top">
              <h3 class="stop-title">${stop.name}</h3>
              <span class="stop-time">${stop.time}</span>
            </div>
            <p class="stop-desc">${stop.note}</p>
            <div class="stop-links">
              <a class="stop-link" href="https://www.waze.com/ul?q=${encodeURIComponent(stop.dest)}&navigate=yes" onclick="event.stopPropagation()">🚗 Waze</a>
              <a class="stop-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stop.dest)}" onclick="event.stopPropagation()" target="_blank">📍 Maps</a>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');
  showDay(0);
}

function showDay(index) {
  document.querySelectorAll('.day-tab').forEach((tab, i) => {
    tab.classList.toggle('active', i === index);
  });
  document.querySelectorAll('.day-card').forEach((card, i) => {
    card.classList.toggle('active-day', i === index);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openDetail(name, note, dest) {
  document.getElementById('modalBody').innerHTML = `
    <h3 style="margin-top:0; font-size:18px;">${name}</h3>
    <p style="color:var(--muted); font-size:14px; line-height:1.5;">${note}</p>
    <p style="font-size:13px; font-weight:600; margin-top:16px;">יעד לניווט: ${dest}</p>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <a href="https://www.waze.com/ul?q=${encodeURIComponent(dest)}&navigate=yes" style="flex:1; padding:12px; background:var(--primary); color:#fff; text-align:center; border-radius:8px; font-weight:700; font-size:13px;">נווט ב-Waze</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}" target="_blank" style="flex:1; padding:12px; background:var(--surface-hover); color:var(--text); text-align:center; border-radius:8px; font-weight:700; font-size:13px; border:1px solid var(--line-dark);">פתח במפות</a>
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('open');
}

function openTicketsModal() {
  alert('ארנק הכרטיסים ייפתח כאן.');
}

function openEmergencyModal() {
  alert('מספרי חירום: 112');
}

document.addEventListener('DOMContentLoaded', renderDays);
</script>

</body>
</html>
